services:
  simventory:
    build:
      context: .
      dockerfile: Dockerfile
    image: simventory:latest
    container_name: simventory
    restart: unless-stopped
    ports:
      # Map container port 3000 to port 8080 on your host (change 8080 if needed)
      - "8080:3000"
    volumes:
      # Persistent storage for components, images, and history
      - ./data:/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
